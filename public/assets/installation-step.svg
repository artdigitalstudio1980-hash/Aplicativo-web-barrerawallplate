<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#FAFAFA"/>

  <!-- Central glow -->
  <circle cx="300" cy="300" r="200" fill="url(#glow)"/>

  <!-- Abstract wall plate representation -->
  <rect x="180" y="180" width="240" height="280" rx="20" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
  <rect x="220" y="240" width="160" height="160" rx="4" fill="#1A1A1A"/>

  <!-- Snap indicator circles -->
  <circle cx="200" cy="200" r="4" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.3"/>
  <circle cx="400" cy="200" r="4" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="440" r="4" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.3"/>
  <circle cx="400" cy="440" r="4" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.3"/>

  <!-- Motion lines suggesting snap -->
  <g stroke="#1A1A1A" stroke-width="1" opacity="0.2">
    <line x1="100" y1="300" x2="170" y2="300"/>
    <line x1="120" y1="250" x2="175" y2="260"/>
    <line x1="120" y1="350" x2="175" y2="340"/>
    <line x1="500" y1="300" x2="430" y2="300"/>
    <line x1="480" y1="250" x2="425" y2="260"/>
    <line x1="480" y1="350" x2="425" y2="340"/>
  </g>

  <!-- Label -->
  <text x="300" y="520" font-family="system-ui, sans-serif" font-size="12" font-weight="300" fill="#999" text-anchor="middle" letter-spacing="2">SNAP &amp; SECURE</text>
</svg>
