<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFEFEF"/>
      <stop offset="100%" style="stop-color:#E0E0E0"/>
    </linearGradient>
    <linearGradient id="plasticGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8D8D8"/>
      <stop offset="100%" style="stop-color:#C0C0C0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#wallBefore)"/>

  <!-- Cheap Plastic Wall Plate -->
  <rect x="180" y="260" width="440" height="480" rx="8" fill="url(#plasticGrad)" filter="drop-shadow(0 4 8 rgba(0,0,0,0.1))"/>

  <!-- Ugly highlight on cheap plastic -->
  <rect x="180" y="260" width="440" height="60" rx="8" fill="#E8E8E8" opacity="0.5"/>

  <!-- Inner area -->
  <rect x="200" y="280" width="400" height="440" rx="4" fill="#BEBEBE"/>

  <!-- Switch opening -->
  <rect x="300" y="370" width="200" height="260" rx="4" fill="#888"/>

  <!-- Switch mechanism -->
  <rect x="340" y="410" width="120" height="180" rx="60" fill="#666"/>
  <rect x="355" y="425" width="90" height="100" rx="45" fill="#555"/>

  <!-- VISIBLE SCREWS - The problem! -->
  <!-- Top left screw -->
  <circle cx="220" cy="300" r="8" fill="#A0A0A0"/>
  <circle cx="220" cy="300" r="6" fill="#888"/>
  <line x1="216" y1="300" x2="224" y2="300" stroke="#666" stroke-width="2"/>
  <line x1="220" y1="296" x2="220" y2="304" stroke="#666" stroke-width="2"/>

  <!-- Top right screw -->
  <circle cx="580" cy="300" r="8" fill="#A0A0A0"/>
  <circle cx="580" cy="300" r="6" fill="#888"/>
  <line x1="576" y1="300" x2="584" y2="300" stroke="#666" stroke-width="2"/>
  <line x1="580" y1="296" x2="580" y2="304" stroke="#666" stroke-width="2"/>

  <!-- Bottom left screw -->
  <circle cx="220" cy="700" r="8" fill="#A0A0A0"/>
  <circle cx="220" cy="700" r="6" fill="#888"/>
  <line x1="216" y1="700" x2="224" y2="700" stroke="#666" stroke-width="2"/>
  <line x1="220" y1="696" x2="220" y2="704" stroke="#666" stroke-width="2"/>

  <!-- Bottom right screw -->
  <circle cx="580" cy="700" r="8" fill="#A0A0A0"/>
  <circle cx="580" cy="700" r="6" fill="#888"/>
  <line x1="576" y1="700" x2="584" y2="700" stroke="#666" stroke-width="2"/>
  <line x1="580" y1="696" x2="580" y2="704" stroke="#666" stroke-width="2"/>

  <!-- Yellowing indicator -->
  <rect x="180" y="680" width="100" height="20" rx="2" fill="#B8A060" opacity="0.3"/>

  <!-- Visual noise lines -->
  <g opacity="0.05" stroke="#666" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
  </g>
</svg>
