<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#wallGrad)"/>

  <!-- Subtle texture lines -->
  <g opacity="0.03" stroke="#999" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="900" x2="800" y2="900"/>
  </g>

  <!-- Wall Plate Shadow -->
  <rect x="200" y="280" width="400" height="440" rx="24" fill="#000" opacity="0.1" filter="url(#shadow)"/>

  <!-- Main Wall Plate -->
  <rect x="200" y="280" width="400" height="440" rx="24" fill="url(#plateGrad)" filter="url(#shadow)"/>

  <!-- Plate Edge Highlight -->
  <rect x="200" y="280" width="400" height="4" rx="2" fill="#FFF" opacity="0.8"/>

  <!-- Inner recessed area -->
  <rect x="220" y="300" width="360" height="400" rx="16" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Switch Cutout -->
  <rect x="320" y="380" width="160" height="240" rx="8" fill="#1A1A1A"/>

  <!-- Switch Toggle -->
  <rect x="360" y="420" width="80" height="160" rx="40" fill="#4A4A4A"/>
  <rect x="375" y="435" width="50" height="80" rx="25" fill="#2A2A2A"/>

  <!-- Seamless indicator - no visible screws -->
  <circle cx="230" cy="300" r="3" fill="#E0E0E0" opacity="0"/>
  <circle cx="570" cy="300" r="3" fill="#E0E0E0" opacity="0"/>
  <circle cx="230" cy="700" r="3" fill="#E0E0E0" opacity="0"/>
  <circle cx="570" cy="700" r="3" fill="#E0E0E0" opacity="0"/>

  <!-- Brand subtle mark -->
  <text x="400" y="680" font-family="system-ui, sans-serif" font-size="10" font-weight="300" fill="#CCC" text-anchor="middle" letter-spacing="3">BARRERA</text>

  <!-- Floating accent -->
  <circle cx="620" cy="340" r="60" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
  <circle cx="620" cy="340" r="80" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.05"/>
</svg>
